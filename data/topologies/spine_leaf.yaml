---
# Sample 2-Spine, 4-Leaf Topology
# This topology represents a typical data center spine-leaf fabric

topology:
  name: "2-spine-4-leaf"
  type: "spine-leaf"

devices:
  # Spine switches (aggregation layer)
  - name: spine1
    role: spine
    loopback: 10.0.0.1/32
    asn: 65100
    ports:
      - name: Ethernet1
        speed: 100000
      - name: Ethernet2
        speed: 100000
      - name: Ethernet3
        speed: 100000
      - name: Ethernet4
        speed: 100000

  - name: spine2
    role: spine
    loopback: 10.0.0.2/32
    asn: 65100
    ports:
      - name: Ethernet1
        speed: 100000
      - name: Ethernet2
        speed: 100000
      - name: Ethernet3
        speed: 100000
      - name: Ethernet4
        speed: 100000

  # Leaf switches (access layer)
  - name: leaf1
    role: leaf
    loopback: 10.0.1.1/32
    asn: 65001
    ports:
      - name: Ethernet1
        speed: 100000
      - name: Ethernet2
        speed: 100000
      - name: Ethernet3
        speed: 25000
      - name: Ethernet4
        speed: 25000

  - name: leaf2
    role: leaf
    loopback: 10.0.1.2/32
    asn: 65002
    ports:
      - name: Ethernet1
        speed: 100000
      - name: Ethernet2
        speed: 100000
      - name: Ethernet3
        speed: 25000
      - name: Ethernet4
        speed: 25000

  - name: leaf3
    role: leaf
    loopback: 10.0.1.3/32
    asn: 65003
    ports:
      - name: Ethernet1
        speed: 100000
      - name: Ethernet2
        speed: 100000
      - name: Ethernet3
        speed: 25000
      - name: Ethernet4
        speed: 25000

  - name: leaf4
    role: leaf
    loopback: 10.0.1.4/32
    asn: 65004
    ports:
      - name: Ethernet1
        speed: 100000
      - name: Ethernet2
        speed: 100000
      - name: Ethernet3
        speed: 25000
      - name: Ethernet4
        speed: 25000

# Full mesh connectivity between spines and leaves
links:
  # Spine1 connections
  - endpoints: [spine1:Ethernet1, leaf1:Ethernet1]
    network: 10.1.1.0/31
  - endpoints: [spine1:Ethernet2, leaf2:Ethernet1]
    network: 10.1.1.2/31
  - endpoints: [spine1:Ethernet3, leaf3:Ethernet1]
    network: 10.1.1.4/31
  - endpoints: [spine1:Ethernet4, leaf4:Ethernet1]
    network: 10.1.1.6/31

  # Spine2 connections
  - endpoints: [spine2:Ethernet1, leaf1:Ethernet2]
    network: 10.1.2.0/31
  - endpoints: [spine2:Ethernet2, leaf2:Ethernet2]
    network: 10.1.2.2/31
  - endpoints: [spine2:Ethernet3, leaf3:Ethernet2]
    network: 10.1.2.4/31
  - endpoints: [spine2:Ethernet4, leaf4:Ethernet2]
    network: 10.1.2.6/31

# BGP configuration hints
bgp:
  spine_policy:
    description: "eBGP peering with all leaves"
    peer_group: LEAF_PEERS

  leaf_policy:
    description: "eBGP peering with all spines"
    peer_group: SPINE_PEERS
    advertise:
      - loopback
      - connected
