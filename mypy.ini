# =============================================================================
# Organization-wide mypy configuration
# Python static type checking
# https://mypy.readthedocs.io/en/stable/config_file.html
# =============================================================================
#
# Mypy is a static type checker for Python. It catches type errors before
# runtime, improving code quality and enabling better IDE support.
#
# To test locally: mypy --config-file configs/mypy.ini path/to/code
# =============================================================================

[mypy]
# =============================================================================
# Python version
# =============================================================================
# python_version: Target Python version for type checking
# Must match the version used in production to ensure compatibility
# Affects available stdlib stubs and type syntax
python_version = 3.11

# =============================================================================
# Import discovery
# =============================================================================
# ignore_missing_imports: Don't error on imports without type stubs
# True = allows using untyped third-party packages without adding stubs
# Essential for gradual adoption - not all packages have type annotations
ignore_missing_imports = True

# follow_imports: How to handle imported modules
# normal = type-check imported modules (recommended for full coverage)
# silent = check but don't report errors in imported modules
# skip = don't type-check imported modules at all
follow_imports = normal

# =============================================================================
# Strictness settings
# =============================================================================
# These settings control how strict mypy is about type checking.
# We use a balanced approach: catch real bugs without being too pedantic.

# strict: Enable all strict mode options at once
# False = we enable specific strict options individually for control
# Full strict mode is too aggressive for gradual adoption
strict = False

# warn_return_any: Warn if a function returns Any when it shouldn't
# Catches functions that accidentally lose type information
warn_return_any = True

# warn_unused_configs: Warn about unused [mypy-*] config sections
# Helps keep config clean when modules are renamed or removed
warn_unused_configs = True

# warn_redundant_casts: Warn about unnecessary type casts
# Catches casts that don't do anything (e.g., cast(int, already_int))
warn_redundant_casts = True

# warn_unused_ignores: Warn about # type: ignore comments that aren't needed
# Keeps the codebase clean - remove ignores when underlying issues are fixed
warn_unused_ignores = True

# warn_no_return: Warn about functions that don't return but should
# Catches missing return statements in functions with return types
warn_no_return = True

# warn_unreachable: Warn about unreachable code (detected via types)
# Catches dead code like: if x is None: ... elif x is not None: ... else: ...
warn_unreachable = True

# =============================================================================
# Error output formatting
# =============================================================================
# show_error_codes: Include error codes like [arg-type] in messages
# Makes it easier to selectively ignore specific errors
show_error_codes = True

# show_column_numbers: Show column number in error messages
# Helps pinpoint exact location of errors in long lines
show_column_numbers = True

# show_error_context: Show source code context around errors
# Makes error messages more readable in CI output
show_error_context = True

# pretty: Use pretty-printed error messages with colors
# Improves readability in terminal output
pretty = True

# =============================================================================
# Caching
# =============================================================================
# cache_dir: Directory for mypy's cache files
# Speeds up subsequent runs by caching module analysis
cache_dir = .mypy_cache

# incremental: Use incremental mode (cache previous results)
# Dramatically speeds up repeated runs during development
incremental = True

# =============================================================================
# Miscellaneous
# =============================================================================
# verbosity: How verbose mypy output should be (0-2)
# 0 = normal output, 1 = more info, 2 = debug
verbosity = 0

# color_output: Use colors in output (when terminal supports it)
color_output = True

# =============================================================================
# Namespace packages
# =============================================================================
# namespace_packages: Enable PEP 420 namespace package support
# Required for packages that span multiple directories without __init__.py
namespace_packages = True

# explicit_package_bases: Use MYPYPATH and current directory as package roots
# Helps mypy find packages in monorepo structures
explicit_package_bases = True

# =============================================================================
# Exclusions
# =============================================================================
# exclude: Regex patterns for paths to exclude from checking
# These are typically generated, vendored, or external code
# Uses Python regex with verbose mode ((?x)) for readability
exclude = (?x)(
    ^build/         # Build output directories
    | ^dist/        # Distribution packages
    | ^\.venv/      # Virtual environments
    | ^\.git/       # Git internals
    | ^__pycache__/ # Python bytecode cache
    | \.egg-info/   # Package metadata
    | ^migrations/  # Database migrations (auto-generated)
    | ^vendor/      # Vendored third-party code
  )

# =============================================================================
# Per-module overrides: Test files
# =============================================================================
# Relaxed settings for test code where strict typing is less important

# tests.* - Test package (tests/module.py)
[mypy-tests.*]
# ignore_errors: Don't report any errors in test modules
# Tests often use dynamic features that are hard to type correctly
ignore_errors = True

# disallow_untyped_defs: Don't require type annotations on functions
# Test functions often don't benefit from annotations
disallow_untyped_defs = False

# test_* - Test files at any level (test_module.py)
[mypy-test_*]
ignore_errors = True
disallow_untyped_defs = False

# =============================================================================
# Per-module overrides: Third-party packages without stubs
# =============================================================================
# These packages either don't have type stubs or their stubs are incomplete.
# We explicitly ignore missing imports to suppress repeated warnings.

# pytest - Testing framework
# Has partial stubs but fixture typing is complex
[mypy-pytest.*]
ignore_missing_imports = True

# requests - HTTP library
# Has stubs (types-requests) but not always installed
[mypy-requests.*]
ignore_missing_imports = True

# yaml - PyYAML
# Has stubs (types-PyYAML) but not always installed
[mypy-yaml.*]
ignore_missing_imports = True

# rich - Terminal formatting library
# Limited type stub coverage
[mypy-rich.*]
ignore_missing_imports = True
